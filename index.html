<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>အစားအသောက် မီနူး</title>
<!-- 缅甸语 Unicode 字体（Noto Sans Myanmar 覆盖完整，Padauk 为备选） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;600;700&family=Padauk:wght@400;700&display=swap" rel="stylesheet">
<!-- QR 码生成库：lean-qr（轻量、无依赖） -->
<script src="https://cdn.jsdelivr.net/npm/lean-qr@2/dist/lean-qr.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Noto Sans Myanmar', 'Padauk', 'Myanmar3', sans-serif;
    background: #faf7f2;
    color: #2c2c2c;
    min-height: 100vh;
  }

  /* 顶部餐厅信息 */
  .header {
    background: #1a1a1a;
    color: #fff;
    padding: 18px 16px 14px;
    text-align: center;
    position: sticky; top: 0; z-index: 50;
  }
  .header h1 { font-size: 20px; font-weight: 700; letter-spacing: 0.5px; }
  .header .table-badge {
    display: inline-block;
    margin-top: 6px;
    background: #d4a24e;
    color: #1a1a1a;
    font-size: 13px;
    font-weight: 700;
    padding: 3px 14px;
    border-radius: 20px;
  }

  /* QR 码区（桌牌扫码用） */
  .qr-section {
    text-align: center;
    padding: 16px 16px 8px;
    background: #fff;
    border-bottom: 1px solid #eee;
  }
  .qr-section canvas, .qr-section svg {
    width: 130px !important; height: 130px !important;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .qr-section p { font-size: 11px; color: #999; margin-top: 6px; }

  /* 分类标签 */
  .tabs {
    display: flex;
    overflow-x: auto;
    background: #fff;
    border-bottom: 1px solid #eee;
    position: sticky; top: 86px; z-index: 40;
    -ms-overflow-style: none; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto;
    padding: 12px 18px;
    font-size: 14px;
    font-weight: 600;
    color: #888;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.2s, border-color 0.2s;
    white-space: nowrap;
    font-family: inherit;
  }
  .tab.active { color: #1a1a1a; border-bottom-color: #d4a24e; }

  /* 菜单列表 */
  .menu-list { padding: 12px 14px 100px; }
  .menu-item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #fff;
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    transition: box-shadow 0.2s;
  }
  .menu-item:active { box-shadow: 0 0 0 2px #d4a24e; }
  .item-info { flex: 1; min-width: 0; }
  .item-name {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.45;
    margin-bottom: 2px;
  }
  .item-desc {
    font-size: 12px;
    color: #888;
    line-height: 1.4;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .item-price {
    font-size: 15px;
    font-weight: 700;
    color: #c0392b;
    white-space: nowrap;
  }
  .btn-order {
    background: #1a1a1a;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    font-family: inherit;
    transition: background 0.2s;
  }
  .btn-order:active { background: #d4a24e; color: #1a1a1a; }
  .btn-order:disabled { background: #ccc; cursor: default; }

  /* 底部提示条 */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #1a1a1a;
    color: #fff;
    padding: 10px 22px;
    border-radius: 24px;
    font-size: 13px;
    opacity: 0;
    transition: transform 0.3s, opacity 0.3s;
    z-index: 999;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- 顶部 -->
<div class="header">
  <h1>ရွှေမြို့တော် စားသောက်ဆိုင်</h1>
  <span class="table-badge">စားပွဲ အမှတ် — <span id="tableNum">?</span></span>
</div>

<!-- QR 码：桌牌扫码后显示此页 -->
<div class="qr-section">
  <div id="qrcode"></div>
  <p>ဖုန်းဖြင့် စကန်ဖတ်၍ မီနူးကြည့်ပါ</p>
</div>

<!-- 分类 -->
<div class="tabs" id="tabs"></div>

<!-- 菜单 -->
<div class="menu-list" id="menuList"></div>

<!-- 轻提示 -->
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   1. 配置区（只有这里需要改）
   ============================================================ */
const CONFIG = {
  // Telegram Bot 配置 —— 这些不会显示在页面上
  BOT_TOKEN: '8939398684:AAEaQfZVtCdzzKMLyKdqBVHFrp1CuEoVXNc',
  CHAT_ID:   '1949334561',

  // 餐厅信息
  RESTAURANT: 'ရွှေမြို့တော် စားသောက်ဆိုင်',

  // QR 码指向的菜单地址（部署后改成你的真实地址）
  MENU_URL: window.location.href.split('?')[0]
};

/* ============================================================
   2. 菜单数据（缅甸语）
   ============================================================ */
const MENU = {
  'ခေါက်ဆွဲ': {
    label: 'ခေါက်ဆွဲ',
    items: [
      { id: 'm1', name: 'မုန့်ဟင်းခါး', desc: 'ငါးဖြင့် ချက်ထားသော ရှမ်းခေါက်ဆွဲ', price: 4500 },
      { id: 'm2', name: 'အုန်းနို့ခေါက်ဆွဲ', desc: 'အုန်းနို့အရသာ ကြက်သားခေါက်ဆွဲ', price: 5000 },
      { id: 'm3', name: 'ကြက်သားခေါက်ဆွဲ', desc: 'ပြုတ်ကြက်သား ခေါက်ဆွဲ', price: 5500 },
      { id: 'm4', name: 'ဝက်သားခေါက်ဆွဲ', desc: 'ဝက်သားခြောက် ခေါက်ဆွဲ', price: 5000 },
    ]
  },
  'ထမင်း': {
    label: 'ထမင်း',
    items: [
      { id: 'r1', name: 'ကြက်သားထမင်း', desc: 'ကြက်သားကြော်၊ ထမင်းဖြူ၊ ဟင်းသီးဟင်းရွက်', price: 6000 },
      { id: 'r2', name: 'ဝက်သားထမင်း', desc: 'ဝက်သားကြော်၊ ထမင်းဖြူ', price: 6500 },
      { id: 'r3', name: 'ငါးထမင်း', desc: 'ငါးကြော်၊ ထမင်းဖြူ', price: 7000 },
      { id: 'r4', name: 'သစ်သီးထမင်း', desc: 'အသီးအရွက်သုပ်နှင့် ထမင်း', price: 5000 },
    ]
  },
  'ဟင်းရည်': {
    label: 'ဟင်းရည်',
    items: [
      { id: 's1', name: 'ကြက်သားဟင်းရည်', desc: 'ကြက်သားပြုတ်ရည်', price: 3500 },
      { id: 's2', name: 'ဝက်သားဟင်းရည်', desc: 'ဝက်သားပြုတ်ရည်', price: 4000 },
      { id: 's3', name: 'ငါးဟင်းရည်', desc: 'ငါးချက်ရည်', price: 4500 },
    ]
  },
  'အချိုရည်': {
    label: 'အချိုရည်',
    items: [
      { id: 'd1', name: 'လက်ဖက်ရည်', desc: 'မြန်မာ့ရိုးရာ လက်ဖက်ရည်', price: 1500 },
      { id: 'd2', name: 'ကော်ဖီ', desc: 'နို့ကော်ဖီ / ကော်ဖီအမဲ', price: 2000 },
      { id: 'd3', name: 'သစ်သီးဖျော်ရည်', desc: 'လိမ္မော်သီး / သရက်သီး ဖျော်ရည်', price: 2500 },
      { id: 'd4', name: 'ရေသန့်', desc: 'သန့်စင်ထားသော သောက်ရေ', price: 800 },
    ]
  }
};

/* ============================================================
   3. 工具函数
   ============================================================ */
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2200);
}

function getTableNumber() {
  const params = new URLSearchParams(window.location.search);
  return params.get('table') || '—';
}

/* ============================================================
   4. QR 码生成（lean-qr）
   ============================================================ */
function renderQR() {
  const container = document.getElementById('qrcode');
  if (typeof leanQR === 'undefined') {
    container.innerHTML = '<p style="font-size:12px;color:#aaa;">QR 库加载失败</p>';
    return;
  }
  const table = getTableNumber();
  const url = CONFIG.MENU_URL + (CONFIG.MENU_URL.includes('?') ? '&' : '?') + 'table=' + encodeURIComponent(table);
  const qr = leanQR.generate(url, { minVersion: 5 });
  const canvas = document.createElement('canvas');
  qr.drawCanvas(canvas, 4); // 4 = 像素缩放
  container.innerHTML = '';
  container.appendChild(canvas);
}

/* ============================================================
   5. 菜单渲染
   ============================================================ */
let activeCategory = Object.keys(MENU)[0];

function renderTabs() {
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  Object.keys(MENU).forEach(key => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (key === activeCategory ? ' active' : '');
    btn.textContent = MENU[key].label;
    btn.onclick = () => {
      activeCategory = key;
      renderTabs();
      renderMenu();
    };
    tabsEl.appendChild(btn);
  });
}

function renderMenu() {
  const listEl = document.getElementById('menuList');
  const items = MENU[activeCategory].items;
  listEl.innerHTML = '';
  items.forEach(item => {
    const row = document.createElement('div');
    row.className = 'menu-item';
    row.innerHTML = `
      <div class="item-info">
        <div class="item-name">${item.name}</div>
        <div class="item-desc">${item.desc || ''}</div>
      </div>
      <div class="item-price">${item.price.toLocaleString()} Ks</div>
      <button class="btn-order" data-id="${item.id}">မှာယူ</button>
    `;
    listEl.appendChild(row);
  });

  // 绑定下单事件
  listEl.querySelectorAll('.btn-order').forEach(btn => {
    btn.onclick = () => handleOrder(btn.dataset.id, btn);
  });
}

/* ============================================================
   6. Telegram Bot 下单（核心逻辑）
   ============================================================ */
async function handleOrder(itemId, btnEl) {
  // 找到菜品
  let item = null;
  for (const cat of Object.values(MENU)) {
    const found = cat.items.find(i => i.id === itemId);
    if (found) { item = found; break; }
  }
  if (!item) return;

  const table = getTableNumber();

  // 如果 Token 未配置，只提示（不报错）
  if (!CONFIG.BOT_TOKEN || CONFIG.BOT_TOKEN === 'YOUR_BOT_TOKEN_HERE') {
    toast('Bot မချိတ်ဆက်ရသေးပါ (Demo)');
    return;
  }

  // 按钮防重复点击
  btnEl.disabled = true;
  btnEl.textContent = 'ပို့နေသည်...';

  // 构建消息（缅甸语）
  const lines = [
    `🍽 ${CONFIG.RESTAURANT}`,
    `🪑 စားပွဲ အမှတ်: ${table}`,
    `———————————`,
    `📋 မှာယူသည့် အစားအသောက်:`,
    `• ${item.name} × 1`,
    `💰 စျေးနှုန်း: ${item.price.toLocaleString()} Ks`,
    `———————————`,
    `🕐 ${new Date().toLocaleString('my-MM')}`
  ].join('\n');

  const url = `https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/sendMessage`;

  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        chat_id: CONFIG.CHAT_ID,
        text: lines,
        parse_mode: 'HTML'
      })
    });

    const data = await res.json();

    if (data.ok) {
      toast('✅ အော်ဒါ ပို့ပြီးပါပြီ');
      btnEl.textContent = 'ပို့ပြီး';
    } else {
      console.error('Telegram error:', data);
      toast('❌ ပို့မရပါ၊ ထပ်ကြိုးစားပါ');
      btnEl.disabled = false;
      btnEl.textContent = 'မှာယူ';
    }
  } catch (err) {
    console.error(err);
    toast('❌ ကွန်ရက် အမှား');
    btnEl.disabled = false;
    btnEl.textContent = 'မှာယူ';
  }
}

/* ============================================================
   7. 初始化
   ============================================================ */
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('tableNum').textContent = getTableNumber();
  renderQR();
  renderTabs();
  renderMenu();
});
</script>
</body>
</html>
